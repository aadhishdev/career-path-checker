
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Degree Comparison Result</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>Career Checker</h2>

        <a href="/dashboard"
           class="{% if request.path == '/dashboard' %}active{% endif %}">
            <i class="fa-solid fa-house"></i>
            <span>Dashboard</span>
        </a>

        <a href="/resume"
           class="{% if request.path == '/resume' %}active{% endif %}">
            <i class="fa-solid fa-file"></i>
            <span>Resume Analyzer</span>
        </a>

        <a href="/degree_compare"
           class="{% if request.path == '/degree_compare' %}active{% endif %}">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Compare Degrees</span>
        </a>

        <a href="/career_advisor"
           class="{% if request.path == '/career_advisor' %}active{% endif %}">
            <i class="fa-solid fa-robot"></i>
            <span>AI Career Advisor</span>
        </a>

        <a href="/job_market"
           class="{% if request.path == '/job_market' %}active{% endif %}">
            <i class="fa-solid fa-chart-column"></i>
            <span>Job Market Trends</span>
        </a>

        <a href="/roadmap"
           class="{% if request.path == '/roadmap' %}active{% endif %}">
            <i class="fa-solid fa-map"></i>
            <span>Learning Roadmap</span>
        </a>

        <a href="/career-gap"
           class="{% if request.path == '/career-gap' %}active{% endif %}">
            <i class="fa-solid fa-chart-line"></i>
            <span>Career Gap Analyzer</span>
        </a>

        <a href="/profile"
           class="{% if request.path == '/profile' %}active{% endif %}">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </a>

        <a href="/logout">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Logout</span>
        </a>

    </div>

    <!-- Main Content -->

    <div class="main">

        <h1>🎓 AI Degree Comparison</h1>

        <h3>Degree 1 : {{ degree1 }}</h3>

        <h3>Degree 2 : {{ degree2 }}</h3>

        <br>

        <div class="analysis">

            <pre>{{ comparison }}</pre>

        </div>

        <br><br>

        <a href="/degree_compare">
            <button>
                🔙 Compare Again
            </button>
        </a>

    </div>

</div>

</body>

</html>
